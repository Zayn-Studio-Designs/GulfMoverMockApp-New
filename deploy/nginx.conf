# Reference nginx server block for self-hosting the built SPA (dist/). Not deployed by
# this repository. TLS certificates, server_name and the Supabase project reference must
# be supplied by ATCO IT. Mirrors public/_headers.
server {
  listen 443 ssl http2;
  server_name gulfmover.example;            # replace
  root /var/www/gulf-mover/dist;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4GvGAkuWvQGMLEYnOMTIcSRNeeMYPZKSVV3O+kBnbRo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://YOUR-PROJECT-REF.supabase.co; font-src 'self' data:; connect-src 'self' https://YOUR-PROJECT-REF.supabase.co wss://YOUR-PROJECT-REF.supabase.co; media-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache" always; }
  location = /build-info.json { add_header Cache-Control "no-store" always; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
server { listen 80; server_name gulfmover.example; return 301 https://$host$request_uri; }
