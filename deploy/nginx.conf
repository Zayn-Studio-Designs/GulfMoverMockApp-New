# Reference nginx server block for self-hosting the built SPA (dist/). Not deployed by
# this repository. TLS certificates, server_name and the Supabase project reference must
# be supplied by ATCO IT. Mirrors public/_headers.
server {
  listen 443 ssl http2;
  server_name gulfmover.example;            # replace
  root /var/www/gulf-mover/dist;

  # Security headers live in a snippet included by EVERY location: nginx does not inherit
  # server-level add_header into a location that sets its own (Cache-Control) header.
  # Copy deploy/nginx-security-headers.conf (after write-csp) to /etc/nginx/gulf-mover-security-headers.conf.

  location /assets/ { include /etc/nginx/gulf-mover-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location = /sw.js { include /etc/nginx/gulf-mover-security-headers.conf; add_header Cache-Control "no-cache" always; }
  location = /build-info.json { include /etc/nginx/gulf-mover-security-headers.conf; add_header Cache-Control "no-store" always; }
  location / { include /etc/nginx/gulf-mover-security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
server { listen 80; server_name gulfmover.example; return 301 https://$host$request_uri; }
