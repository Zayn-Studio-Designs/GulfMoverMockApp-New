# Security headers for every Gulf Mover response (included by deploy/nginx.conf in EACH location).
# nginx rule: a location that has ANY add_header inherits NONE from the server level, so these
# must be included inside every location block — never only at server level.
# `node scripts/release/write-csp.mjs --nginx-headers <out>` writes the real project origins.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4GvGAkuWvQGMLEYnOMTIcSRNeeMYPZKSVV3O+kBnbRo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://YOUR-PROJECT-REF.supabase.co; font-src 'self' data:; connect-src 'self' https://YOUR-PROJECT-REF.supabase.co wss://YOUR-PROJECT-REF.supabase.co; media-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
