<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <script>
      // Apply the stored appearance before first paint: no light flash for dark-mode users.
      (function () {
        try {
          var p = localStorage.getItem('gm-theme');
          if (p !== 'light' && p !== 'dark' && p !== 'system') p = 'system';
          var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = p === 'system' ? (m ? 'dark' : 'light') : p;
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) { /* private mode: light default */ }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12345A" />
    <title>ATCO Marine — Marine Transfer App (demo)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
