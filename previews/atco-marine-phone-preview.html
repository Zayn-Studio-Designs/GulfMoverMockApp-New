<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ATCO Marine — Phone Preview</title>
<style>
:root{--navy:#12345A;--ice:#eef3f6;--muted:#5d7182}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#eef3f0,#d3e2d9);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
h1{margin:0;font-size:20px}
p{margin:6px 0 16px;color:var(--muted);text-align:center;max-width:520px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.controls button{border:1px solid #b8c7d1;background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.controls button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.phone{position:relative;background:#111;border-radius:52px;padding:14px;box-shadow:0 30px 70px rgba(11,31,51,.35),inset 0 0 0 2px #333;transition:width .2s,height .2s}
.phone.android{border-radius:38px;padding:10px}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#111;border-radius:20px;z-index:2;pointer-events:none}
.phone.android .notch{width:14px;height:14px;top:18px;border-radius:50%}
.screen{width:100%;height:100%;border:0;border-radius:40px;background:#fff;display:block}
.phone.android .screen{border-radius:30px}
.note{margin-top:18px;font-size:12px;color:var(--muted)}
</style></head>
<body>
<h1>ATCO Marine — phone preview</h1>
<p>The real app shown at phone size. Tap through it as on a phone: bottom menu, booking steps, and the EN / العربية switch at the top.</p>
<div class="controls">
  <button type="button" data-w="390" data-h="844" data-k="iphone" class="on">iPhone 14</button>
  <button type="button" data-w="375" data-h="667" data-k="iphone-se">iPhone SE</button>
  <button type="button" data-w="412" data-h="915" data-k="android">Android (Pixel 7)</button>
</div>
<div class="phone" id="phone">
