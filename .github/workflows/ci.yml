name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Whitespace / conflict-marker check
        run: git diff --check HEAD~1 HEAD || git diff --check
      - name: Secret scan (fail on committed keys)
        run: |
          if git grep -nE '(sk_live_[A-Za-z0-9]{8,}|sb_secret_[A-Za-z0-9]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!package-lock.json' ':!src/tests'; then
            echo "Possible secret committed"; exit 1; fi
      - name: Dependency audit (report only; review high findings)
        run: npm audit --omit=dev --audit-level=high || true

  database:
    name: Database (clean install, RLS, finance, concurrency, upgrade, backup drill)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Clean install of every migration on a disposable database
        run: scripts/db/local-db.sh up
      - name: SQL-level security and business tests
        run: npm run test:db
        env: { GM_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' }
      - name: Phase 7 -> Phase 8 upgrade path
        run: npm run test:db:upgrade
      - name: Backup and restore drill
        run: scripts/db/backup-restore-drill.sh
      - if: always()
        run: scripts/db/local-db.sh down
