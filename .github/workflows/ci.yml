name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Whitespace / conflict-marker check
        run: git diff --check HEAD~1 HEAD || git diff --check
      - name: Secret scan (fail on committed keys)
        run: |
          if git grep -nE '(sk_live_[A-Za-z0-9]{8,}|sb_secret_[A-Za-z0-9]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!package-lock.json' ':!src/tests'; then
            echo "Possible secret committed"; exit 1; fi
      - name: Dependency audit (report only; review high findings)
        run: npm audit --omit=dev --audit-level=high || true

  database:
    name: Database (clean install, RLS, finance, concurrency, upgrade, backup drill)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Clean install of every migration on a disposable database
        run: scripts/db/local-db.sh up
      - name: SQL-level security and business tests
        run: npm run test:db
        env: { GM_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' }
      - name: Phase 7 -> Phase 8 upgrade path
        run: npm run test:db:upgrade
      - name: Backup and restore drill
        run: scripts/db/backup-restore-drill.sh
      - if: always()
        run: scripts/db/local-db.sh down

  supabase-e2e:
    name: Real Supabase Auth + end-to-end (disposable stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - name: Start disposable Supabase stack
        run: |
          # Keep disposable credentials out of logs: capture output, show only a
          # redacted tail (JWT-shaped secrets replaced), fail loudly on error.
          set +e
          supabase start > /tmp/gm-supabase-start.log 2>&1
          code=$?
          set -e
          redact() { sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[JWT-REDACTED]/g'; }
          if [ $code -ne 0 ]; then
            echo "supabase start failed (exit $code); redacted tail:"
            redact < /tmp/gm-supabase-start.log | tail -30
            exit $code
          fi
          echo "supabase start ok; redacted tail:"
          redact < /tmp/gm-supabase-start.log | tail -8
      - name: Export loopback-only test credentials
        run: |
          ENV_OUT="$(supabase status --env)"
          echo "credential names seen: $(echo "$ENV_OUT" | cut -d= -f1 | tr '\n' ' ')"
          clean() { sed "s/^export //" | cut -d= -f2- | tr -d '\042\047\015'; }
          SUPABASE_URL="$(echo "$ENV_OUT" | grep -E '(^|_)((SUPABASE|API)_URL)=' | head -1 | clean)"
          ANON_KEY="$(echo "$ENV_OUT" | grep -E 'ANON_KEY=' | head -1 | clean)"
          SERVICE_KEY="$(echo "$ENV_OUT" | grep -E 'SERVICE_ROLE_KEY=' | head -1 | clean)"
          case "$SUPABASE_URL" in http://127.0.0.1:*|http://localhost:*) ;; *) echo "REFUSAL: not loopback" >&2; exit 1;; esac
          [ -n "$ANON_KEY" ] && [ -n "$SERVICE_KEY" ] || { echo "missing keys from supabase status" >&2; exit 1; }
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"
          {
            echo "GM_E2E_SUPABASE_URL=$SUPABASE_URL"
            echo "GM_E2E_ANON_KEY=$ANON_KEY"
            echo "GM_E2E_SERVICE_KEY=$SERVICE_KEY"
          } >> "$GITHUB_ENV"
      - name: Build app against the disposable stack
        run: |
          export VITE_APP_MODE=production
          export VITE_SUPABASE_URL="$GM_E2E_SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$GM_E2E_ANON_KEY"
          npm run build
      - name: Serve production preview
        run: |
          (npx vite preview --port 4319 --host 127.0.0.1 > /tmp/gm-preview.log 2>&1 &) 
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4319/ >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:4319/ >/dev/null
      - name: Real Auth + PostgREST integration tests
        run: node scripts/e2e/phase13-real-auth.mjs
      - name: Real-backend browser journeys
        run: node scripts/e2e/phase13-real-browser.mjs
        env:
          GM_E2E_APP_URL: http://127.0.0.1:4319
      - name: Phase 14 auth gaps (expired tokens, pending guards, HTTP concurrency)
        run: node scripts/e2e/phase14-real-auth-gaps.mjs
      - name: Phase 14 browser gaps (pending member, second booker)
        run: node scripts/e2e/phase14-real-browser-gaps.mjs
        env:
          GM_E2E_APP_URL: http://127.0.0.1:4319
      - name: Stop disposable stack
        if: always()
        run: supabase stop
